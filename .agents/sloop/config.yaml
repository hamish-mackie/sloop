version: 1
worktree_dir: .worktrees

# Each settled worktree regrows a multi-GB cargo target dir, so keep the
# window well under the 7d default to bound disk use.
worktree_retention: 24h

scheduler:
  max_parallel_tasks: 2

agent:
  default_target: opencode
  targets:
    claude:
      # stream-json emits output as it arrives. Plain `--print` buffers until
      # exit, which leaves runs unobservable mid-flight and makes the
      # scheduler's output-silence detection measure silence-by-design.
      cmd:
        - claude
        - --print
        - --output-format
        - stream-json
        - --verbose
        - --model
        - "{model}"
        - --effort
        - "{effort}"
        - "{prompt}"
    opencode:
      cmd:
        - opencode
        - run
        - --model
        - "{model}"
        - --variant
        - "{effort}"
        - "{prompt}"
    codex:
      cmd:
        - codex
        - exec
        - --model
        - "{model}"
        - --config
        - 'model_reasoning_effort="{effort}"'
        - --sandbox
        - workspace-write
        - --ephemeral
        - "{prompt}"
